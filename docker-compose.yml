services:

  db:
    image: postgres:16
    restart: always
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
      - ./db/init:/docker-entrypoint-initdb.d:ro
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}

  adminer:
    image: adminer
    restart: always
    ports: ["8082:8080"]
    depends_on: [db]
    environment:
      - ADMINER_DESIGN=pepa-linha-dark

  prestart:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    image: maverick-backend
    depends_on:
      db: {condition: service_healthy, restart: true}
    command: bash scripts/prestart.sh
    env_file: .env
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - FRONTEND_HOST=${FRONTEND_HOST:-http://localhost}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost}
      - ACTIVE_MODEL=${ACTIVE_MODEL:-current_base}

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    image: maverick-backend
    restart: always
    ports: ["8000:8000"]
    volumes:
      - ./datasets:/data/datasets
      - ./model_artifacts:/model_artifacts:ro
    depends_on:
      db: {condition: service_healthy, restart: true}
      prestart: {condition: service_completed_successfully}
    env_file: .env
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - FRONTEND_HOST=${FRONTEND_HOST:-http://localhost}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost}
      - ACTIVE_MODEL=${ACTIVE_MODEL:-current_base}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: services/frontend
      dockerfile: Dockerfile
    image: maverick-streamlit
    restart: always
    ports: ["8501:8501"]
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false
    depends_on:
      backend: {condition: service_healthy}

  dw-api:
    build:
      context: services/dw-api
      dockerfile: Dockerfile
    image: algo-dw-api
    restart: always
    ports: ["8001:8001"]
    depends_on:
      db: {condition: service_healthy, restart: true}
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      - ENVIRONMENT=production

  collector:
    build:
      context: services/collector
      dockerfile: Dockerfile
    image: algo-collector
    restart: always
    depends_on:
      db: {condition: service_healthy, restart: true}
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=${POSTGRES_PORT:-5432}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - FMP_API_KEY=${FMP_API_KEY}
      - SYMBOLS=${SYMBOLS:-AAPL,AMD,AMZN,BA,MSFT,NVDA,GOOGL,TSLA}
      - MARKET_TZ=${MARKET_TZ:-America/New_York}
      - MARKET_OPEN=${MARKET_OPEN:-04:00}
      - MARKET_CLOSE=${MARKET_CLOSE:-21:00}
      - LOG_DIR=/app/logs

  scheduler:
    build:
      context: .
      dockerfile: docker/scheduler/Dockerfile
    image: algo-scheduler
    restart: always
    depends_on:
      db: {condition: service_healthy, restart: true}
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=${POSTGRES_PORT:-5432}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - FMP_API_KEY=${FMP_API_KEY}
      - SYMBOLS=${SYMBOLS:-AAPL,AMD,AMZN,BA,MSFT,NVDA,GOOGL,TSLA}
      - MARKET_TZ=${MARKET_TZ:-America/New_York}
      - MARKET_OPEN=${MARKET_OPEN:-04:00}
      - MARKET_CLOSE=${MARKET_CLOSE:-21:00}
      - LOG_DIR=/app/logs

  # ── Web terminal — re-authenticate NIBI MFA from the browser ──────────────
  # Access at http://localhost:7681
  # Use: bash ml/ml/nibi/morning_login.sh  → approve Duo push → socket live
  # Only needed when SSH ControlMaster socket has expired.
  # Do NOT expose port 7681 publicly — localhost only.
  webterminal:
    image: tsl0922/ttyd:latest
    restart: always
    ports: ["127.0.0.1:7681:7681"]
    volumes:
      - ~/.ssh:/root/.ssh:ro
      - ./ml:/app/ml:ro
      - ./logs:/app/logs
    working_dir: /app
    command: ttyd -p 7681 -t fontSize=15 bash
    environment:
      - HOME=/root

volumes:
  app-db-data:
